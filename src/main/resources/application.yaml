server:
  port: 8081

spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: ${hmdp.datasource.driver-class-name}
    url: jdbc:mysql://${hmdp.datasource.host}/${hmdp.datasource.database}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${hmdp.datasource.username}
    password: ${hmdp.datasource.password}

  rabbitmq:
    host: ${hmdp.rabbitmq.host}
    port: ${hmdp.rabbitmq.port}
    username: ${hmdp.rabbitmq.username}
    password: ${hmdp.rabbitmq.password}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
    publisher-confirm-type: correlated
    publisher-returns: true
    virtual-host: '/'
  redis:
    host: ${hmdp.redis.host}
    port: ${hmdp.redis.port}
    password: ${hmdp.redis.password}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
